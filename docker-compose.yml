version: "3.9"

services:
  # ─── Database ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: animus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animuspass}
      POSTGRES_DB: ${POSTGRES_DB:-animus_studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Queue ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: animus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: animus_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-animus}:${POSTGRES_PASSWORD:-animuspass}@postgres:5432/${POSTGRES_DB:-animus_studio}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./agents:/app/agents
      - ./storage:/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Worker ───────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: animus_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-animus}:${POSTGRES_PASSWORD:-animuspass}@postgres:5432/${POSTGRES_DB:-animus_studio}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./agents:/app/agents
      - ./storage:/storage
    depends_on:
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: animus_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

  # ─── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: animus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
